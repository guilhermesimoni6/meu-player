<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Player</title>
<meta name="theme-color" content="#120a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Player">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-tape" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><circle cx="8.5" cy="11" r="2.2"/><circle cx="15.5" cy="11" r="2.2"/><path d="M7 19l1.6-3.2h6.8L17 19"/></g></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></g></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></g></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.2" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M11.5 6.4v11.2a.8.8 0 0 1-1.28.64L3.4 13a1.2 1.2 0 0 1 0-2l6.82-5.24a.8.8 0 0 1 1.28.64z" fill="currentColor"/><path d="M21 6.4v11.2a.8.8 0 0 1-1.28.64L12.9 13a1.2 1.2 0 0 1 0-2l6.82-5.24A.8.8 0 0 1 21 6.4z" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M12.5 6.4v11.2a.8.8 0 0 0 1.28.64L20.6 13a1.2 1.2 0 0 0 0-2l-6.82-5.24a.8.8 0 0 0-1.28.64z" fill="currentColor"/><path d="M3 6.4v11.2a.8.8 0 0 0 1.28.64L11.1 13a1.2 1.2 0 0 0 0-2L4.28 5.76A.8.8 0 0 0 3 6.4z" fill="currentColor"/></symbol>
    <symbol id="i-eject" viewBox="0 0 24 24"><path d="M12 4.5 4.2 14.5h15.6z" fill="currentColor"/><rect x="4.5" y="17" width="15" height="3" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15.5 8.8a4.5 4.5 0 0 1 0 6.4M18.5 5.8a8.5 8.5 0 0 1 0 12.4"/></g></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></g></symbol>
  </defs>
</svg>
<div id="bg"></div>

<section id="login" class="screen">
  <span class="brand-icon" aria-hidden="true"><svg><use href="#i-tape"/></svg></span>
  <h1>Meu Player</h1>
  <p id="login-msg">Entre com sua conta Spotify Premium.</p>
  <button id="btn-login" class="pill">Entrar com Spotify</button>
</section>

<main id="app" class="screen hidden">
  <header>
    <div class="brand"><span class="brand-icon" aria-hidden="true"><svg><use href="#i-tape"/></svg></span><span>Meu Player</span></div>
    <button id="btn-shelf" class="shelf-btn" type="button" aria-expanded="false" aria-controls="shelf" title="Abrir as fitas"><svg aria-hidden="true"><use href="#i-tape"/></svg><span>Fitas</span></button>
    <div class="search">
      <input id="q" type="search" aria-label="Buscar músicas ou artistas" placeholder="Buscar músicas, artistas…" autocomplete="off">
    </div>
    <button id="btn-logout" class="ghost" title="Sair">Sair</button>
  </header>

  <div id="shelf" class="hidden">
  <section id="results" class="hidden"></section>

  <section id="library" class="hidden" aria-label="Sua biblioteca">
    <div class="lib-head">
      <button id="lib-back" class="lib-back hidden" type="button" aria-label="Voltar às fitas"><svg><use href="#i-back"/></svg></button>
      <h3 id="lib-title">Suas fitas</h3>
      <button id="lib-play" class="lib-play hidden" type="button">Tocar tudo</button>
    </div>
    <div id="lib-list" class="lib-list"></div>
  </section>
  </div>

  <section id="now" data-playing="false">
    <div class="boombox" id="boombox">
      <!-- Compartimento da fita: só marca a posição na tela (o desenho é feito em 3D) -->
      <div class="door" aria-hidden="true"><div class="tape empty"></div></div>
    </div>

    <!-- Controles reais: ficam escondidos e são acionados pelo toca-fitas 3D e pelo teclado -->
    <div class="legacy">
      <div class="switches">
        <button id="btn-shuffle" type="button" aria-label="Aleatório" title="Aleatório" aria-pressed="false"></button>
        <button id="btn-repeat" type="button" aria-label="Repetir" title="Repetir" aria-pressed="false" data-mode="off"></button>
      </div>
      <div class="knob" id="knob-vol" role="slider" tabindex="-1" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60"><i></i></div>
      <div class="knob big" id="knob-tune" role="slider" tabindex="-1" aria-label="Posição na faixa" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
      <div class="dial-text">
        <h2 id="title">Nada tocando</h2>
        <p id="artist">Escolha uma fita</p>
        <span id="t-cur">0:00</span><span id="t-dur">0:00</span>
      </div>
      <p id="tape-name" class="tape-name">Sem fita</p>
      <img id="cover" alt="Capa do álbum">
      <button class="reel" id="reel-l" type="button" aria-label="Voltar 10 segundos" title="Voltar 10 s"></button>
      <button class="reel" id="reel-r" type="button" aria-label="Avançar 10 segundos" title="Avançar 10 s"></button>
      <button id="btn-prev" type="button" aria-label="Faixa anterior"><svg><use href="#i-prev"/></svg></button>
      <button id="btn-next" type="button" aria-label="Próxima faixa"><svg><use href="#i-next"/></svg></button>
      <button id="btn-eject" type="button" aria-label="Ejetar a fita e escolher outra"><svg><use href="#i-eject"/></svg></button>
      <button id="btn-play" type="button" aria-label="Tocar" data-state="paused"><svg><use href="#i-play"/></svg></button>
      <button id="btn-pause" type="button" aria-label="Pausar" data-state="off"><svg><use href="#i-pause"/></svg></button>
      <button id="btn-mute" type="button" aria-label="Silenciar"><svg class="ic-vol"><use href="#i-vol"/></svg><svg class="ic-mute"><use href="#i-mute"/></svg></button>
    </div>
    <input id="vol" class="sr" type="range" aria-label="Volume" min="0" max="100" value="60" tabindex="-1">
    <input id="seek" class="sr" type="range" aria-label="Posição na faixa" min="0" max="1000" value="0" tabindex="-1">
    <p id="status" role="status"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script src="config.js?v=3"></script>
<script src="app.js?v=3"></script>
<script src="deck3d.js?v=3"></script>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>
